let db=load();let page='overview';let q='';let filter='all';let selectedId=null;let activePack=[];
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const data=JSON.parse(raw);if(data&&Array.isArray(data.records)&&Array.isArray(data.history))return data;}}catch(e){}return structuredClone(seed)}
function save(){try{db.meta.savedAt=new Date().toISOString();localStorage.setItem(STORAGE_KEY,JSON.stringify(db));const p=document.querySelector('.topbar .pill');if(p)p.textContent='● このブラウザに保存中';}catch(e){toast('保存できません。JSONでエクスポートしてください。',true)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function nl(s){return esc(s).replace(/\n/g,'<br>')}
function today(){return new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'})}
function niceDate(s){return esc(s||'未記録')}
function byType(type){return db.records.filter(x=>x.type===type)}
function sortRec(arr){return [...arr].sort((a,b)=>(a.priority==='高'?-2:a.priority==='中'?-1:0)-(b.priority==='高'?-2:b.priority==='中'?-1:0)||String(b.updated||'').localeCompare(String(a.updated||'')))}
function countOpen(){return db.records.filter(x=>x.type==='question' && !['確定','撤回・不採用'].includes(x.status)).length}
function tag(x){const css={'確定':'green','暫定採用':'gold','検討中':'purple','保留':'gray','提案':'purple','撤回・不採用':'red','検証済':'green','再検証要':'red'}[x]||'gray';return `<span class="mini-tag ${css}">${esc(x)}</span>`}
function icon(name){const icons={overview:'◈',voice:'♫',spec:'▣',lore:'✧',question:'?',task:'☑',test:'◉',change:'⇆',handoff:'↗',settings:'⚙'};return icons[name]||'◇'}
function nav(){document.getElementById('nav').innerHTML=NAV.map(([id,_,label])=>`<button data-nav="${id}" class="${page===id?'active':''}"><span style="font-size:17px;width:19px;text-align:center">${icon(id)}</span>${label}${['question','task'].includes(id)?`<span class="count">${id==='question'?countOpen():byType('task').filter(x=>x.stage!=='検証済').length}</span>`:''}</button>`).join('');document.getElementById('crumb').textContent=(NAV.find(x=>x[0]===page)||[])[2]||'OVERVIEW'}
function header(kicker,title,desc,actions=''){return `<div class="heading"><div><div class="eyebrow">${esc(kicker)}</div><h1>${esc(title)}</h1><p>${esc(desc)}</p></div><div class="head-actions">${actions}</div></div>`}
function btnAdd(type){return `<button class="btn primary" data-new="${type}">＋ ${esc(TYPE[type])}を追加</button>`}
function rowRecord(r){return `<div class="listrow"><span class="number">${esc(r.id)}</span><div class="grow"><b>${esc(r.title)}</b><small>${esc(r.next||r.body||'')}</small></div>${tag(r.status)}<button class="icon-btn" data-view="${esc(r.id)}" aria-label="詳細を見る">詳細</button></div>`}
function cardRecord(r){return `<article class="record"><div class="idline"><code>${esc(r.id)} · ${esc(TYPE[r.type]||'')}</code>${r.scope==='変更禁止（保護）'?'<span class="lock" title="変更禁止（保護）">♜ 保護</span>':''}</div><h3>${esc(r.title)}</h3><p>${esc(r.body)}</p><div class="linebreak">${tag(r.status)}<span class="mini-tag gray">${esc(r.stage)}</span>${r.priority==='高'?'<span class="mini-tag red">優先 高</span>':''}</div><div class="foot"><small>更新 ${niceDate(r.updated)}</small><button class="btn small ghost" data-view="${esc(r.id)}">詳細・編集 →</button></div></article>`}

function catalog(type){const arr=sortRec(byType(type).filter(x=>{const query=q.trim().toLowerCase();return (filter==='all'||x.status===filter||x.stage===filter||x.scope===filter)&&(!query||[x.id,x.title,x.body,x.next,x.source,x.reason].join(' ').toLowerCase().includes(query))}));const hints={spec:'入力・移動・衝突・UIなどを責務ごとに管理。変更禁止範囲と変更可範囲を明示します。',lore:'灼道／蠢動、登場人物、世界線、訂正履歴を混同しない物語設定台帳。',question:'未決・保留の理由と再開条件を残す。未決を確定扱いにしません。',task:'PC作業の着手順・実装状態・完了条件を管理。',test:'環境・手順・期待結果・実際結果・再現性を記録。',change:'保護された機能を守りながら、変更対象と影響範囲を管理。'};return header('PROJECT DATABASE',TYPE[type],hints[type],btnAdd(type))+`<div class="toolbar"><input class="searchbox" placeholder="ID・タイトル・本文を検索" value="${esc(q)}" id="search"><select id="filter"><option value="all">すべての状態</option>${[...STATUS,...STAGES,...SCOPES].map(x=>`<option value="${esc(x)}" ${filter===x?'selected':''}>${esc(x)}</option>`).join('')}</select><span class="tiny muted">${arr.length} 件表示 / 全 ${byType(type).length} 件</span></div>`+(type==='spec'?`<div class="notice" style="margin-bottom:16px">♜ 「変更禁止（保護）」のカードは、編集時に理由と明示的な確認を求めます。DI・移動・衝突の契約は原則維持。</div>`:'')+(arr.length?`<div class="cards">${arr.map(cardRecord).join('')}</div>`:`<div class="empty"><div class="big">◇</div><h3>該当する記録はありません</h3><p>フィルターや検索語を変更するか、新しいカードを追加してください。</p></div>`)}
function voicePage(){const logs=sortRec(byType('voice'));return header('VOICE NOTES','音声会話の記録','車内では会話だけ。安全に停車した後、話した内容を貼り付け、確定・仮説・保留と次のPC作業を切り分けます。',`<button class="btn primary" id="voiceFormOpen">＋ 音声会話を整理する</button>`)+`<div class="cols2"><div class="panel"><div class="mini-title">CAPTURE → REUSE</div><h3>音声会話の後処理</h3><p>発言の全文・要約・出典を保存。決まった事項はシステム仕様か物語設定に、次の手順は実装タスクに転記して再利用できます。</p><div class="notice blue">走行中は入力や操作をせず、音声会話に集中してください。この画面での記録・確認は停車後に行う想定です。</div></div><div class="panel"><div class="mini-title">VOICE PREPARATION</div><h3>次の音声会話に持ち込む質問</h3>${sortRec(byType('question').filter(x=>x.status!=='確定')).slice(0,3).map(x=>`<div class="listrow"><div class="grow"><b>${esc(x.title)}</b><small>${esc(x.reason)}</small></div><button class="icon-btn" data-view="${esc(x.id)}">開く</button></div>`).join('')}<button class="btn ghost small" data-copy="voicePrompt">会話開始プロンプトをコピー</button></div></div><div class="section" style="margin-top:22px"><div class="sectionhead"><h2>保存した会話決定メモ</h2><span>${logs.length} 件</span></div>${logs.length?`<div class="cards">${logs.map(cardRecord).join('')}</div>`:`<div class="empty"><div class="big">🎙</div><h3>音声会話のメモはまだありません</h3><p>最初の会話記録を追加して、仕様やPC作業へつないでください。</p><button class="btn primary" id="voiceFormEmpty">＋ 会話記録を作る</button></div>`}</div>`}

function makePcPack(chosen){const protectedRecs=byType('spec').filter(x=>x.scope==='変更禁止（保護）');const questions=sortRec(byType('question').filter(x=>x.priority==='高'&&x.status!=='確定')).slice(0,3);return `# 外道不覚悟｜次のPC作業パック\n生成: ${today()}\n現行参照: ${db.meta.baseline}\n\n## 今回の作業\n${chosen.length?chosen.map((x,i)=>`${i+1}. [${x.id}] ${x.title}\n   内容: ${x.body}\n   次の手順: ${x.next}\n   状態: ${x.stage}`).join('\n'):'（未選択）'}\n\n## 変更禁止（保護）領域\n${protectedRecs.map(x=>`- ${x.id}: ${x.title} — ${x.body}`).join('\n')}\n\n## 着手前に注意\n- 既存の基準版を退避し、差分の対象を明示する。\n- 保護領域に触れる場合は理由・代替案・影響範囲・回帰テストを先に記録する。\n- 実装完了と動作検証完了は別々に更新する。\n\n## 高優先度の未決事項\n${questions.map(x=>`- ${x.id}: ${x.title}／理由: ${x.reason}`).join('\n')}\n\n## 終了時の記録\n変更ファイル／実施内容／テスト環境／期待結果／実際結果／残課題／次回会話で決めること`}

if(old?.scope==='変更禁止（保護）'){const changed=['title','body','status','stage','scope'].some(k=>String(old[k]??'')!==String(next[k]??''));if(changed&&fd.get('unlock')!=='on'){toast('保護領域の変更には明示的な確認が必要です。',true);return}if(changed&&!next.reason.trim()){toast('保護領域の変更理由を入力してください。',true);return}}
if(old){db.records=db.records.map(x=>x.id===id?next:x);log('カード更新',`${next.id}｜${next.title}${old.scope==='変更禁止（保護）'?'（保護対象）':''}`)}else{db.records.unshift(next);log('カード追加',`${next.id}｜${next.title}`)}closeModal();render();toast('保存しました')}
function deleteRecord(id){const r=db.records.find(x=>x.id===id);if(!r)return;if(r.scope==='変更禁止（保護）'){toast('保護カードは削除できません。変更申請を記録してください。',true);return}if(!confirm(`${id}「${r.title}」を削除しますか？\nこの操作は変更履歴に残ります。`))return;db.records=db.records.filter(x=>x.id!==id);log('カード削除',`${id}｜${r.title}`);closeModal();render();toast('削除しました')}
function voiceForm(){openModal(`<form id="voiceCapture"><div class="modalheader"><h2>音声会話の内容を整理</h2><button type="button" class="close" data-close>×</button></div><div class="modalcontent"><div class="field"><label>会話の見出し *</label><input name="title" required placeholder="例：ジャンプ仕様の条件を決定"></div><div class="field"><label>会話の本文・決定内容</label><textarea name="body" rows="8" placeholder="ChatGPTとの音声会話の終わりにまとめた内容や、チャットからコピーした抜粋を貼り付け"></textarea></div><div class="fieldrow"><div class="field"><label>判断状態</label><select name="status">${opt(STATUS,'暫定採用')}</select></div><div class="field"><label>変更対象の扱い</label><select name="scope">${opt(SCOPES,'境界確認要')}</select></div></div><div class="field"><label>保留・決めきれなかった理由</label><textarea name="reason" rows="2"></textarea></div><div class="field"><label>次にPCで試すこと</label><textarea name="next" rows="2"></textarea></div><div class="field"><label>参照する会話・日時</label><input name="source" value="${esc(today())} ChatGPT音声会話（手動入力）"></div><div class="notice blue">音声メモは「決定の記録」です。システムの正式仕様やPCタスクにする場合は、保存後に「別カードへ転記」を押してください。</div></div><div class="modalfooter"><span class="tiny muted">会話本文はこの端末のブラウザに保存</span><div class="right"><button type="button" class="btn ghost" data-close>キャンセル</button><button class="btn primary" type="submit">記録する</button></div></div></form>`)}
function saveVoice(form){const fd=new FormData(form);const title=String(fd.get('title')||'').trim();if(!title)return toast('見出しを入力してください。',true);const r={id:idFor('voice'),type:'voice',title,body:String(fd.get('body')||''),status:String(fd.get('status')),stage:'対象外',priority:'中',scope:String(fd.get('scope')),reason:String(fd.get('reason')||''),evidence:'音声会話を人が転記。原文の正確性は記録者が確認。',next:String(fd.get('next')||''),source:String(fd.get('source')||''),updated:today()};db.records.unshift(r);log('音声メモ追加',`${r.id}｜${title}`);closeModal();render();toast('音声メモを保存しました')}
function promote(id){const r=db.records.find(x=>x.id===id);if(!r)return;openModal(`<div class="modalheader"><h2>${esc(id)} をどこへ転記しますか</h2><button class="close" data-close>×</button></div><div class="modalcontent"><p class="muted">音声メモ自体は残し、出典を紐付けた新しいカードを作ります。正式な確定への昇格は自動では行いません。</p><div class="cols3">${['spec','lore','question','task','change'].map(t=>`<button class="btn" data-fromvoice="${esc(id)}" data-targettype="${t}">${esc(TYPE[t])}</button>`).join('')}</div></div><div class="modalfooter"><button class="btn ghost" data-close>閉じる</button></div>`)}
function markdown(){let s=`# 外道不覚悟｜開発台帳\n出力: ${today()}\n基準: ${db.meta.baseline}\n\n`;for(const [type,title] of Object.entries(TYPE)){s+=`## ${title}\n\n`;for(const r of db.records.filter(x=>x.type===type)){s+=`### ${r.id} ${r.title}\n- 判断: ${r.status}\n- 実装・検証: ${r.stage}\n- 優先: ${r.priority}\n- 範囲: ${r.scope}\n- 更新: ${r.updated}\n- 内容: ${r.body}\n- 保留／変更理由: ${r.reason}\n- 証拠: ${r.evidence}\n- 次の作業: ${r.next}\n- 出典: ${r.source}\n\n`;}}s+='## 変更履歴\n'+db.history.map(h=>`- ${h.date}｜${h.action}：${h.detail}`).join('\n');return s}
function download(name,text,mime){const blob=new Blob([text],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500)}
function exportJson(){download(`gedo-dashboard-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(db,null,2),'application/json;charset=utf-8');toast('JSONを書き出しました')}
function exportMd(){download(`gedo-dev-handoff-${new Date().toISOString().slice(0,10)}.md`,markdown(),'text/markdown;charset=utf-8');toast('Markdownを書き出しました')}
async function copyText(s){try{await navigator.clipboard.writeText(s);toast('コピーしました')}catch(e){openModal(`<div class="modalheader"><h2>コピー用テキスト</h2><button class="close" data-close>×</button></div><div class="modalcontent"><textarea id="copyFallback" style="width:100%;height:350px;background:#101827;color:white;border:1px solid var(--border);padding:12px">${esc(s)}</textarea><p class="tiny muted">ブラウザにクリップボード権限がないため、この欄から手動コピーしてください。</p></div><div class="modalfooter"><button class="btn" data-close>閉じる</button></div>`);document.getElementById('copyFallback')?.select()}}
function toast(message,error=false){document.getElementById('toastWrap').innerHTML=`<div class="toast" style="${error?'background:#4b2931;border-color:#a05a68;color:#ffe1e5':''}">${esc(message)}</div>`;setTimeout(()=>{const wrap=document.getElementById('toastWrap');if(wrap)wrap.innerHTML=''},3300)}
function importJson(){const input=document.getElementById('importFile');if(!input?.files?.[0])return toast('JSONを選択してください。',true);const mode=document.getElementById('importMode').value;const reader=new FileReader();reader.onload=()=>{try{const imported=JSON.parse(reader.result);if(!Array.isArray(imported.records)||!Array.isArray(imported.history))throw Error('records/history がありません');if(imported.records.some(x=>!x||typeof x.id!=='string'||!TYPE[x.type]||typeof x.title!=='string'))throw Error('カードの形式が異なります');if(!confirm(`${imported.records.length} 件のデータを${mode==='replace'?'置換':'統合'}します。実行しますか？`))return;if(mode==='replace'){db={version:1,created:imported.created||today(),records:imported.records,history:imported.history,meta:imported.meta||structuredClone(seed.meta)}}else{const map=new Map(db.records.map(x=>[x.id,x]));imported.records.forEach(x=>map.set(x.id,x));db.records=[...map.values()];db.history.push(...imported.history.slice(-100));}log('バックアップ取込',`${mode==='replace'?'置換':'統合'} ${imported.records.length}件`);render();toast('取り込みが完了しました')}catch(e){toast('取り込み失敗: '+e.message,true)}};reader.readAsText(input.files[0],'utf-8')}
function resetData(){if(!confirm('編集したカードと履歴を初期状態に戻します。バックアップは取りましたか？'))return;if(!confirm('本当に初期化しますか？ この操作は元に戻せません。'))return;db=structuredClone(seed);save();render();toast('初期状態に戻しました')}
// Delegated event handlers keep the page functional after every re-render.
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.nav){page=t.dataset.nav;q='';filter='all';render();window.scrollTo({top:0,behavior:'smooth'});return}if(t.dataset.new){editForm(t.dataset.new);return}if(t.dataset.view){viewRecord(t.dataset.view);return}if(t.dataset.edit){editForm('spec',t.dataset.edit);return}if(t.dataset.close!==undefined){closeModal();return}if(t.dataset.delete){deleteRecord(t.dataset.delete);return}if(t.dataset.promote){promote(t.dataset.promote);return}if(t.dataset.fromvoice){editForm(t.dataset.targettype,null,db.records.find(r=>r.id===t.dataset.fromvoice));return}if(t.dataset.copy){copyText(t.dataset.copy==='voicePrompt'?voicePrompt():makePcPack(activePack.length?sortRec(byType('task').filter(x=>activePack.includes(x.id))):sortRec(byType('task').filter(x=>x.pc&&x.stage!=='検証済')).slice(0,3)));return}if(['voiceFormOpen','voiceFormEmpty'].includes(t.id)){voiceForm();return}if(['exportTop','exportJson'].includes(t.id)){exportJson();return}if(['markdownExport','markdownExport2'].includes(t.id)){exportMd();return}if(t.id==='importButton'){importJson();return}if(t.id==='resetData'){resetData();return}});
document.addEventListener('submit',e=>{if(e.target.id==='recordForm'){e.preventDefault();saveRecord(e.target)}if(e.target.id==='voiceCapture'){e.preventDefault();saveVoice(e.target)}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;q=e.target.value;render();const next=document.getElementById('search');next?.focus();next?.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;render()}if(e.target.dataset.pack){const id=e.target.dataset.pack;if(e.target.checked){if(!activePack.includes(id))activePack.push(id)}else{if(!activePack.length){activePack=sortRec(byType('task').filter(x=>x.pc&&x.stage!=='検証済')).slice(0,3).map(x=>x.id)}activePack=activePack.filter(x=>x!==id)}const el=document.getElementById('packPreview');if(el)el.textContent=makePcPack(sortRec(byType('task').filter(x=>activePack.includes(x.id))));}});
document.getElementById('dialog').addEventListener('click',e=>{if(e.target.id==='dialog')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
</script>
</body></html>
