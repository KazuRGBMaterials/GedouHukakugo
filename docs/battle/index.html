<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101924">
  <title>外道不覚悟 | ベルトライン戦闘 試作</title>
  <link rel="stylesheet" href="./style.css?v=5">
</head>
<body>
  <main>
    <header class="page-header">
      <a href="../">フィールドへ戻る</a>
      <h1>ベルトライン戦闘</h1>
      <button id="battle-sound" class="sound-toggle" type="button" aria-pressed="true">
        サウンド <span id="battle-sound-state" aria-hidden="true">ON</span>
      </button>
    </header>
    <section class="arena" aria-label="戦闘状態">
      <div class="fighter">
        <div id="player-pose" class="pose" aria-hidden="true"><div class="sprite"></div></div>
        <div>
          <b>MAGE</b>
          <div id="player-resources" class="resources"></div>
          <div id="player-cue" class="cue"></div>
        </div>
      </div>
      <div class="fighter enemy">
        <div id="enemy-pose" class="pose" aria-hidden="true"><div class="sprite rival"></div></div>
        <div>
          <b>訓練用の見張り</b>
          <div id="enemy-resources" class="resources"></div>
          <div id="enemy-cue" class="cue"></div>
        </div>
      </div>
    </section>
    <p id="battle-status" class="battle-status" role="status">コマンドを選んで予約してください。</p>
    <section class="feedback" aria-label="攻防とスタミナ">
      <div>
        <b class="feedback-label">直近の攻防</b>
        <div id="player-impact" class="impact-result incoming" aria-live="polite"></div>
        <div id="enemy-impact" class="impact-result"></div>
      </div>
      <div>
        <b class="feedback-label">次のスタミナ回復</b>
        <p id="stamina-cue" class="stamina-cue"></p>
      </div>
    </section>
    <section class="timeline" aria-label="行動のタイムライン" tabindex="0">
      <div id="time-axis" class="track" aria-hidden="true"></div>
      <div class="belt-name">相手の予定</div>
      <div id="enemy-belt" class="track"></div>
      <div class="belt-name">自分の予定</div>
      <div id="player-belt" class="track"></div>
    </section>
    <p class="hint">★は効果が出る枠。黄は青に、青は赤に、赤は黄に有利。</p>
    <p class="hint">待機は1枠でスタミナが1回復します。回復する分を、待機のあとに続く技の予約に使えます。</p>
    <section aria-label="コマンド入力" id="commands" class="commands"></section>
    <div class="controls">
      <button id="start" class="primary" type="button">戦闘開始</button>
      <button id="shift" type="button">火炎のインパクトシフト</button>
      <button id="reset" type="button">最初から</button>
    </div>
    <div id="input-status" class="input-status" role="status"></div>
    <p class="hint"><a class="version-link" href="./ver1/">ベルトコンベアVER1（保存版）</a></p>
    <section class="battle-log" aria-label="直近の戦闘ログ" id="battle-log"></section>
  </main>
  <audio id="battle-bgm" src="./battle-loop.wav" preload="none" loop></audio>
  <script type="module" src="./battle.js?v=4"></script>
</body>
</html>
